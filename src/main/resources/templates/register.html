<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<h1>Register</h1>

<form action="/client/register" method="post">
    <label for="clientName">Username:</label>
    <input id="clientName" name="clientName" type="text" required>

    <br>

    <label for="clientPassword">Password:</label>
    <input id="clientPassword" name="clientPassword" type="password" required>

    <br>

    <button type="submit">Register</button>
</form>

<a href="/">Back to home</a>
</body>
</html>
