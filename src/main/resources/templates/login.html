<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>
<h1>Login</h1>

<form action="/client/login" method="post">
  <label for="clientName">Username:</label>
  <input id="clientName" name="clientName" type="text" required>

  <label for="clientPassword">Password:</label>
  <input id="clientPassword" name="clientPassword" type="password" required>

  <button type="submit">Login</button>
</form>

<a href="/client/register">Create an account</a>
</body>
</html>
