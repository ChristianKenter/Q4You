name: GITHUB ACTIONS WORKFLOW

on:
  push:
    branches: [ main, hibernate ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myOllamma
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myOllamma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Validate authentication secret before building
      - name: Validate authentication configuration
        env:
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::APP_SECRET_KEY is missing"
            exit 1
          fi
          echo "Authentication configuration is present."

      - name: Build application
        run: mvn --batch-mode package -DskipTests

      - name: Start application
        env:
          DEPLOYED: "true"
          DB_NAME: myOllamma
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CONNECTION_STR: jdbc:postgresql://localhost:5432/
          ISSUER: MyOllama
          TOKEN_EXPIRE_TIME: "1800000"
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          nohup java -jar target/app.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl --silent --output /dev/null http://localhost:7070/; then
              echo "Application is running!"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start."
          cat app.log
          exit 1

      - name: Run tests
        env:
          DEPLOYED: "true"
          DB_NAME: myOllamma
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CONNECTION_STR: jdbc:postgresql://localhost:5432/
          ISSUER: MyOllama
          TOKEN_EXPIRE_TIME: "1800000"
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: mvn --batch-mode test

      - name: Upload application logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-logs
          path: app.log
          if-no-files-found: ignore

      - name: Login to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: success()
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/q4you_api:latest